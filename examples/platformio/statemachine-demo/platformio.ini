; StateMachine PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/StateMachine@^1.3.0
; (here it points at this repository so every commit is tested).
;
; Needs a C++ compiler with the C++ standard library, so 8-bit AVR is not
; supported.

[env]
lib_deps = symlink://../../..
monitor_speed = 115200

; ESP32 (Xtensa)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32-C3 (RISC-V)
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; STM32 Nucleo-F401RE (Cortex-M4)
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; STM32F4 Discovery (STM32F407VG Cortex-M4).
; Flashed over its ST-LINK/V2, which has no USB serial port: Serial goes to
; USART6 (TX PC6, RX PC7), 115200 8N1, through a 3.3 V USB-UART adapter.
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
build_flags = -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7

; Raspberry Pi Pico (RP2040 Cortex-M0+)
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Desktop (Linux, or Windows with MinGW)
[env:native]
platform = native
